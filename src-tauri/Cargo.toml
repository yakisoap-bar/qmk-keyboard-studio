[package]
name = "max102-tool"
version = "0.1.0"
description = "Standalone cross-platform customization app & CLI for the Weikav / LEKU MAX102 keyboard"
authors = ["MAX102 Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hidapi = { version = "2.6.3", default-features = false, features = ["linux-static-hidraw", "windows-native"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
